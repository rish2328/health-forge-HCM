version: "3.3"
services:
    app:
        build:
            context: .
            dockerfile: ./Dockerfile
        container_name: provider_service_app
        depends_on:
            - db
        volumes:
            - "./:/app"
            - "../common_service:/common_service"
        ports:
            - "8004:8004"
        restart: always
        env_file:
            - .env
            - ../.env

    db:
        image: postgres:16
        container_name: provider_service_db
        restart: always
        env_file:
            - .env
        ports:
            - "5436:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data

volumes:
    postgres_data:


