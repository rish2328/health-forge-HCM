version: "3.3"
services:
    app:
        build:
            context: .
            dockerfile: ./Dockerfile
        container_name: auth_service_app
        depends_on:
            - db
        volumes:
            - "./:/app"
            - "../common_service:/common_service"
        ports:
            - "8001:8001"
        restart: always
        env_file:
            - .env
            - ../.env

    db:
        image: postgres:16
        container_name: auth_service_db
        restart: always
        env_file:
            - .env
        ports:
            - "5433:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data

    # redis:
    #     image: redis:7
    #     container_name: auth_service_redis
    #     ports:
    #         - "6379:6379"

volumes:
    postgres_data:


