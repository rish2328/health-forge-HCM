[project]
name = "auth-service"
version = "0.1.0"
description = "This microservice module will manage all type of Authentication and Authorization, Roles & Permissions Management."
authors = [
    {name = "Rishabh Srivastava", email = "rishabh.sr@cisinlabs.com"}
]
requires-python = ">=3.10,<4.0"
dependencies = [
    "alembic (==1.18.4)",
    "annotated-doc (==0.0.4)",
    "annotated-types (==0.7.0)",
    "anyio (==4.13.0)",
    "bcrypt (==4.0.1)",
    "cffi (==2.0.0)",
    "click (==8.4.1)",
    "cryptography (==48.0.0)",
    "dnspython (==2.8.0)",
    "ecdsa (==0.19.2)",
    "email-validator (==2.3.0)",
    "exceptiongroup (==1.3.1)",
    "fastapi (==0.136.3)",
    "greenlet (==3.5.1)",
    "h11 (==0.16.0)",
    "idna (==3.18)",
    "iniconfig (==2.3.0)",
    "mako (==1.3.12)",
    "markupsafe (==3.0.3)",
    "packaging (==26.2)",
    "passlib (==1.7.4)",
    "pluggy (==1.6.0)",
    "psycopg2-binary (==2.9.12)",
    "pyasn1 (==0.6.3)",
    "pycparser (==3.0)",
    "pydantic (==2.13.4)",
    "pydantic-settings (==2.14.1)",
    "pydantic-core (==2.46.4)",
    "pygments (==2.20.0)",
    "pymysql (==1.2.0)",
    "pytest (==9.0.3)",
    "python-dotenv (==1.2.2)",
    "python-jose (==3.5.0)",
    "python-multipart (==0.0.31)",
    "rsa (==4.9.1)",
    "six (==1.17.0)",
    "sqlalchemy (==2.0.50)",
    "starlette (==1.2.1)",
    "tomli (==2.4.1)",
    "typing-inspection (==0.4.2)",
    "typing-extensions (==4.15.0)",
    "uvicorn (==0.49.0)",
    "redis (>=8.0.1,<9.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
